name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required to request the GitHub OIDC token for NuGet Trusted Publishing
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so MinVer can find the tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # TierGate.Core and TierGate.AspNetCore are versioned together, one number per
      # release. MinVer derives that version from the pushed tag for both projects,
      # so AspNetCore's packed dependency on Core resolves to the version being
      # published in this same run.
      - name: Pack
        run: |
          dotnet pack src/TierGate.Core/TierGate.Core.csproj \
            --configuration Release \
            --no-build \
            -o ./artifacts
          dotnet pack src/TierGate.AspNetCore/TierGate.AspNetCore.csproj \
            --configuration Release \
            --no-build \
            -o ./artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
